<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>今日の言葉</title>
<meta name="description" content="毎日1つ、世界の名言・迷言・毒のある言葉を出典と解説つきで届けるアプリ">
<meta name="theme-color" content="#faf8f3">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">

  <!-- ホーム -->
  <section id="view-home" class="view">
    <div class="top-row">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="テーマ切替">テーマ：端末</button>
    </div>
    <div class="date-row">
      <p id="home-date" class="home-date"></p>
      <nav class="home-links" aria-label="画面切替">
        <button type="button" class="text-link" data-nav="search">検索</button>
        <button type="button" class="text-link" data-nav="history">履歴</button>
        <button type="button" class="text-link" data-nav="favorites">お気に入り</button>
      </nav>
    </div>

    <button id="home-tap" class="quote-tap" type="button" aria-label="タップで解説を見る">
      <span id="home-frame" class="quote-frame"></span>
      <span class="tap-pill">タップで解説を見る →</span>
    </button>

    <div class="action-row">
      <button id="home-fav" class="fav-btn" type="button" aria-label="お気に入り"></button>
      <a id="home-share" class="share-link" href="#" target="_blank" rel="noopener">Xで共有</a>
    </div>

    <div class="section">
      <h2 class="section-title">解説</h2>
      <p id="home-meaning" class="body-text"></p>
    </div>
    <p class="source-line"><span class="source-label">出典：</span><span id="home-source"></span></p>
  </section>

  <!-- 詳細 -->
  <section id="view-detail" class="view" hidden>
    <button id="detail-back" class="back-btn" type="button">← 戻る</button>
    <div id="detail-frame" class="quote-frame"></div>
    <div class="section" id="detail-bio-wrap" hidden>
      <h2 class="section-title">人物紹介</h2>
      <p id="detail-bio" class="body-text"></p>
    </div>
    <div class="action-row">
      <button id="detail-fav" class="fav-btn" type="button" aria-label="お気に入り"></button>
      <a id="detail-share" class="share-link" href="#" target="_blank" rel="noopener">Xで共有</a>
    </div>
    <div id="detail-sections"></div>
    <div class="section" id="detail-same-wrap" hidden>
      <h2 class="section-title" id="detail-same-title">同じ人物の言葉</h2>
      <div id="detail-same" class="list"></div>
    </div>
  </section>

  <!-- 検索 -->
  <section id="view-search" class="view" hidden>
    <button class="back-btn" type="button" data-nav="home">← 戻る</button>
    <div class="search-box">
      <input id="search-keyword" class="search-input" type="search" placeholder="人物名・言葉・タグで検索" autocomplete="off">
      <div class="search-filters">
        <label>大分類
          <select id="search-group" class="search-select"></select>
        </label>
        <label>確度
          <select id="search-grade" class="search-select">
            <option value="">すべて</option>
            <option value="A">A（出典確実）</option>
            <option value="B">B（伝承あり）</option>
            <option value="C">C（帰属に疑義）</option>
          </select>
        </label>
      </div>
    </div>
    <p id="search-count" class="result-count"></p>
    <div id="search-results" class="list"></div>
  </section>

  <!-- お気に入り -->
  <section id="view-favorites" class="view" hidden>
    <button class="back-btn" type="button" data-nav="home">← 戻る</button>
    <div id="favorites-list" class="list"></div>
    <p id="favorites-empty" class="empty-note" hidden>お気に入りはまだありません。星ボタンで登録できます。</p>
  </section>

  <!-- 履歴 -->
  <section id="view-history" class="view" hidden>
    <button class="back-btn" type="button" data-nav="home">← 戻る</button>
    <div id="history-list" class="list"></div>
    <p id="history-empty" class="empty-note" hidden>履歴はまだありません。</p>
  </section>

</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
